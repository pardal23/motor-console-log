<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Console Log + GUI + Pesquisa Universal</title>
    <style>
        /* Console original */
        #meu-console-virtual {
            background-color: #1e1e1e;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            padding: 15px;
            border-radius: 8px;
            min-height: 200px;
            white-space: pre-wrap;
            box-shadow: inset 0 0 10px #000;
            margin-top: 20px;
        }

        /* GUI Search Box */
        .gui-search-box {
            margin: 20px 0;
            display: flex;
            gap: 8px;
            flex-wrap: wrap; /* Para que os botões não quebrem em tamanhos pequenos */
        }
        .gui-input {
            padding: 10px;
            font-size: 15px;
            width: 320px;
            border: 2px solid #333;
            border-radius: 4px;
        }
        .gui-button {
            padding: 10px 22px;
            font-size: 15px;
            background-color: #00ff00;
            color: #1e1e1e;
            border: none;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        .gui-button:hover { background-color: #00cc00; }
        
        /* Botão de pesquisa diferenciado */
        .gui-button-search {
            background-color: #4a90e2;
            color: white;
        }
        .gui-button-search:hover {
            background-color: #357abd;
        }

        /* Janela GUI Virtual */
        #janela-gui-local {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            background-color: #252526;
            border: 2px solid #00ff00;
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 9999;
            font-family: Arial, sans-serif;
        }
        .gui-header {
            background-color: #1e1e1e;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }
        .gui-title { 
            color: #fff; 
            font-weight: bold;
        }
        .gui-close {
            color: #ff5555;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
        }
        .gui-close:hover { color: #ff0000; }
        .gui-body {
            padding: 20px;
            color: #fff;
        }
    </style>
</head>
<body>

    <h2>Controlo de Logs, GUI e Pesquisa</h2>

    <!-- Caixa de Pesquisa / Controlos -->
    <div class="gui-search-box">
        <input type="text" id="input-comando" class="gui-input" placeholder="Digite aqui para pesquisar ou enviar comando...">
        
        <!-- Botão 1: Enviar (apenas log) -->
        <button onclick="executarAcao()" class="gui-button">Enviar (Log)</button>
        
        <!-- Botão 2: Pesquisar (Abre Web) -->
        <button onclick="pesquisarUniversal()" class="gui-button gui-button-search">Pesquisar Universal</button>

        <!-- Botão 3: Abrir GUI -->
        <button onclick="abrirJanelaGUI()" class="gui-button" style="background-color: #007acc; color: white;">Abrir GUI</button>
    </div>

    <!-- Consola Virtual no Ecrã -->
    <div id="meu-console-virtual">// Inicializando consola virtual...<br></div>

    <!-- Janela GUI Virtual (Popup) -->
    <div id="janela-gui-local">
        <div class="gui-header">
            <span class="gui-title">Painel de Controlo Local</span>
            <span class="gui-close" onclick="fecharJanelaGUI()">&times;</span>
        </div>
        <div class="gui-body">
            <p>Este é o conteúdo do seu painel de interface local.</p>
            <p>Estado do Sistema: <span style="color: #00ff00;">Online</span></p>
        </div>
    </div>

    <script>
        // Intercetar o console.log nativo para escrever na consola virtual
        const consoleVirtual = document.getElementById('meu-console-virtual');
        const logOriginal = console.log;

        console.log = function(mensagem) {
            logOriginal(mensagem); // Mantém o log na consola nativa do navegador
            const dataAtual = new Date().toLocaleTimeString();
            consoleVirtual.innerHTML += `[${dataAtual}] ${mensagem}<br>`;
            consoleVirtual.scrollTop = consoleVirtual.scrollHeight; // Auto-scroll para o fim
        };

        // Função: Enviar apenas para o log (comando interno)
        function executarAcao() {
            const input = document.getElementById('input-comando');
            if (input.value.trim() !== "") {
                console.log(`Comando executado: ${input.value}`);
                input.value = ""; // Limpa o input
            } else {
                console.log("Aviso: O input está vazio.");
            }
        }

        // NOVA FUNÇÃO: Pesquisa Universal (Abre no browser)
        function pesquisarUniversal() {
            const input = document.getElementById('input-comando');
            const query = input.value.trim();

            if (query !== "") {
                // Construir URL do Google Search
                const searchUrl = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
                
                // Abrir em nova aba
                window.open(searchUrl, '_blank');
                
                console.log(`Pesquisa iniciada: ${query}`);
                input.value = ""; // Limpar input após pesquisa
            } else {
                console.log("Aviso: Não há texto para pesquisar.");
            }
        }

        // Funções de controlo da Interface (GUI)
        function abrirJanelaGUI() {
            document.getElementById('janela-gui-local').style.display = 'block';
            console.log("Janela GUI aberta.");
        }

        function fecharJanelaGUI() {
            document.getElementById('janela-gui-local').style.display = 'none';
            console.log("Janela GUI fechada.");
        }

        // Log inicial de teste
        console.log("Consola pronta para registar eventos.");
    </script>

</body>
</html>
